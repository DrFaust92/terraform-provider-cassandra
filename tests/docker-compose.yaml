# Cassandra for the acceptance tests, with password authentication and
# authorization enabled (the role and grant resources need both).
#
# The native port accepts plain connections, and TLS connections that present
# a client certificate signed by tests/certs/ca.pem (see `make testacc_certs`).
#
#   make testacc_setup CASSANDRA_VERSION=5.0
services:
  cassandra:
    image: cassandra:${CASSANDRA_VERSION:-5.0}
    ports:
      - "9042:9042"
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    volumes:
      - ./certs:/certs:ro
    entrypoint:
      - sh
      - -c
      - |
        set -e
        conf=/etc/cassandra/cassandra.yaml
        sed -i \
          -e 's/^authenticator:.*/authenticator: PasswordAuthenticator/' \
          -e 's/^authorizer:.*/authorizer: CassandraAuthorizer/' \
          "$$conf"
        # Replace the client_encryption_options block.
        awk '/^client_encryption_options:/ { skip = 1; next } skip && /^[a-z]/ { skip = 0 } !skip' "$$conf" > /tmp/cassandra.yaml
        cat >> /tmp/cassandra.yaml <<'YAML'
        client_encryption_options:
          enabled: true
          optional: true
          require_client_auth: true
          ssl_context_factory:
            class_name: org.apache.cassandra.security.PEMBasedSslContextFactory
          keystore: /certs/server.pem
          truststore: /certs/ca.pem
        YAML
        cat /tmp/cassandra.yaml > "$$conf"
        exec docker-entrypoint.sh cassandra -f
    healthcheck:
      test: ["CMD", "cqlsh", "-u", "cassandra", "-p", "cassandra", "-e", "DESCRIBE KEYSPACES"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
